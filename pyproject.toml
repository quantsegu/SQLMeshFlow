[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlmesh-flow"
version = "0.1.0"
description = "Complete SQLMesh and MetricFlow sources with native semantic-metric model generation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["sqlmesh", "metricflow==0.214.0.dev0"]

[project.scripts]
sqlmesh-flow = "sqlmesh_flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sqlmesh_flow"]

[tool.hatch.envs.default]
python = "3.11"
skip-install = true
dependencies = ["sqlmesh-flow @ {root:uri}", "sqlmesh @ {root:uri}/vendor/sqlmesh", "metricflow @ {root:uri}/vendor/metricflow", "custom_materializations @ {root:uri}/vendor/sqlmesh/examples/custom_materializations", "google-cloud-bigquery[pandas]", "google-cloud-bigquery-storage", "pytest>=8,<9", "pytest-mock", "pytest-xdist", "pytest-asyncio", "pytest-rerunfailures", "ruff"]

[tool.hatch.envs.default.env-vars]
HAMILTON_TELEMETRY_ENABLED = "false"
SQLMESH__DISABLE_ANONYMIZED_ANALYTICS = "true"
SQLMESH_HOME = "{root}/.sqlmesh-user"

[tool.hatch.envs.default.scripts]
test = "python -m pytest tests -p no:rerunfailures -q {args}"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
